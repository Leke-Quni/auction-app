# Deploy from the repository root: fly deploy -c apps/api/fly.toml
# `app` must be unique across Fly.io; `fly launch --no-deploy --copy-config` can set it for you.
app = "auction-api"
primary_region = "fra"
kill_signal = "SIGTERM"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Always keep one machine running: no cold starts, and WebSockets (slice 4) need a long-lived process.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
