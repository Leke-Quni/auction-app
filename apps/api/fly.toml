# Deploy from the repository root: fly deploy -c apps/api/fly.toml
# `app` must be unique across Fly.io. Created with: fly apps create auction-api-leke
app = "auction-api-leke"
primary_region = "fra"
kill_signal = "SIGTERM"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Fly's proxy is the one hop in front of the API, so its word about the caller's address can be believed.
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # Ask Fly to keep one machine running (WebSockets need a long-lived process). On the free trial Fly stops the machine itself
  # 5 minutes after each start whatever this says, and the next request starts it again (about 5 seconds), so keep it
  # warm from outside (see DESIGN.md, "Speed").
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
